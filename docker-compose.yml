services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddshoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=ddshoes
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_PORT=5432

volumes:
  postgres_data:
