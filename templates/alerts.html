{% if messages %} {% for message in messages %}
<div id="message-container" class="container mt-3">
  <!-- Menyesuaikan tag Django (error -> danger) agar warna Bootstrap pas -->
  <div
    class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show"
    role="alert"
    style="border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1)"
  >
    {% if message.tags == 'success' %}
    <i class="fa fa-check-circle mr-2"></i>
    {% elif message.tags == 'error' or message.tags == 'danger' %}
    <i class="fa fa-exclamation-circle mr-2"></i>
    {% endif %} {{ message }}

    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</div>
{% endfor %} {% endif %}

<script>
  // Fungsi untuk menutup alert otomatis setelah 4000ms (4 detik)
  setTimeout(function () {
    var messageContainer = document.getElementById("message-container");
    if (messageContainer) {
      // Menambahkan efek transisi halus sebelum menghilang
      messageContainer.style.transition = "opacity 0.5s ease";
      messageContainer.style.opacity = "0";

      // Menghapus elemen dari DOM setelah animasi selesai
      setTimeout(function () {
        messageContainer.remove();
      }, 500);
    }
  }, 4000);
</script>
