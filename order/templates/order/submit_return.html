{% extends 'base.html' %} {% load static %} {% block content %}
<section class="section-content padding-y bg mt-3">
  <div class="container" style="margin-top: 150px">
    <div class="row justify-content-md-center">
      <aside class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title mb-4">Pengajuan Retur Pesanan</h4>
            <p class="text-muted">Order: #{{ order.order_number }}</p>
            <hr />
            <form
              action="{% url 'submit_return' order.id %}"
              method="POST"
              enctype="multipart/form-data"
            >
              {% csrf_token %}

              <div class="form-group">
                <label>Alasan Retur</label>
                {{ form.reason }}
              </div>

              <div class="form-row">
                <div class="form-group col-md-12">
                  <label>Foto Bukti (Cacat/Salah Barang)</label>
                  {{ form.image_proof }}
                </div>
              </div>

              <div class="bg-light p-3 rounded mb-3">
                <h6 class="text-dark">Data Rekening Refund</h6>
                <div class="form-group">
                  <label>Bank / E-Wallet</label>
                  {{ form.bank_name }}
                </div>
                <div class="form-group">
                  <label>Nomor Rekening</label>
                  {{ form.bank_account_number }}
                </div>
                <div class="form-group">
                  <label>Atas Nama</label>
                  {{ form.bank_account_name }}
                </div>
              </div>

              <button type="submit" class="primary-btn btn-block">
                Kirim Pengajuan
              </button>
            </form>
          </div>
        </div>
      </aside>
    </div>
  </div>
</section>
{% endblock %}
