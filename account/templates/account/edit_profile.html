{% extends 'base.html' %} {% block content %}
<section class="section_gap">
  <div class="container" style="max-width: 600px; margin-top: 70px">
    <div class="billing_details">
      <div class="row">
        <div class="col-lg-12">
          <h3 class="mb-30">Account Profile</h3>
          {% include 'alerts.html' %}
          <form
            class="row contact_form"
            action="{% url 'edit_profile' %}"
            method="POST"
          >
            {% csrf_token %}
            <div class="col-md-6 form-group p_star">
              <label>First Name</label>
              <input
                type="text"
                class="form-control"
                name="first_name"
                value="{{ user.first_name }}"
                required
              />
            </div>
            <div class="col-md-6 form-group p_star">
              <label>Last Name</label>
              <input
                type="text"
                class="form-control"
                name="last_name"
                value="{{ user.last_name }}"
                required
              />
            </div>
            <div class="col-md-12 form-group">
              <label>Email Address</label>
              <input
                type="email"
                class="form-control"
                value="{{ user.email }}"
                readonly
                style="background-color: #f1f1f1"
              />
            </div>
            <div class="col-md-12 form-group">
              <label>Phone Number</label>
              <input
                type="text"
                class="form-control"
                name="phone_number"
                value="{{ user.phone_number }}"
              />
            </div>

            <!-- Input Shoe Size khusus untuk Personalisasi -->
            <div class="col-md-12 form-group">
              <label>Shoe Size (Ukuran Sepatu)</label>
              <input
                type="number"
                class="form-control"
                name="shoe_size"
                value="{{ user.shoe_size }}"
              />
              <div
                style="
                  background-color: #f8f9fa;
                  padding: 10px;
                  border-left: 3px solid #ffba00;
                  margin-top: 5px;
                "
              >
                <small style="color: #666">
                  <i class="fa fa-info-circle" style="color: #ffba00"></i>
                  Mengubah ukuran akan otomatis memperbarui rekomendasi produk
                  di halaman utama.
                </small>
              </div>
            </div>

            <div class="col-md-12 form-group">
              <button type="submit" class="primary-btn w-100">
                Update Profile
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
