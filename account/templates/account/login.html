{% extends 'base.html' %} {% load static %} {% block content %}
<!-- Style agar konsisten dengan register.html -->
<style>
  .login-container {
    max-width: 500px;
    margin: 80px auto;
    padding: 40px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 767px) {
    .login-container {
      margin: 16px auto;
      padding: 24px 16px;
      border-radius: 12px;
    }
    .login_area.section_gap { padding: 20px 0 !important; }
  }
  .register-link-wrapper {
    margin-top: 25px;
    text-align: center;
    font-size: 14px;
    color: #777;
  }
  .register-link-wrapper a {
    color: #ffba00;
    font-weight: 600;
    text-decoration: none;
  }
  .register-link-wrapper a:hover {
    text-decoration: underline;
  }
  .forgot-password-link {
    display: block;
    text-align: right;
    font-size: 13px;
    margin-top: 5px;
    color: #999;
  }
</style>

<section class="login_area section_gap">
  <div class="container">
    <div class="login-container">
      <div class="login_form_inner" style="border: none">
        <h3 style="margin-bottom: 30px">Masuk ke Akun</h3>
        <img
          src="{% static 'img/logo.png' %}"
          alt="DD Shoes Logo"
          style="
            max-height: 60px;
            width: auto;
            object-fit: contain;
            margin-bottom: 30px;
          "
        />

        <!-- Memanggil Alert (Pesan Gagal Login/Logout) -->
        {% include 'alerts.html' %}

        <form
          class="row login_form"
          action="{% url 'login' %}"
          method="POST"
          id="contactForm"
        >
          {% csrf_token %}

          <!-- Email -->
          <div class="col-md-12 form-group">
            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="Alamat Email"
              required
            />
          </div>

          <!-- Password -->
          <div class="col-md-12 form-group" style="margin-top: 15px">
            <input
              type="password"
              class="form-control"
              name="password"
              placeholder="Password"
              required
            />
            <!-- Link Lupa Password -->
            <a href="{% url 'reset_password' %}" class="forgot-password-link"
              >Lupa Password?</a
            >
          </div>

          <!-- Tombol Login -->
          <div class="col-md-12 form-group" style="margin-top: 30px">
            <button
              type="submit"
              value="submit"
              class="primary-btn w-100"
              style="border: none; border-radius: 7px"
            >
              Masuk Sekarang
            </button>
          </div>

          <!-- Link Daftar Kecil di Bawah -->
          <div class="col-md-12 register-link-wrapper">
            <p>Belum Punya Akun? <a href="{% url 'register' %}">Register</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
